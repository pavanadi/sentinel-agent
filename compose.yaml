x-supernode: &sn
  image: flwr/supernode:1.39.0
  environment: &env
    FLWR_MODEL_API_KEY: ${FLWR_MODEL_API_KEY:?Set FLWR_MODEL_API_KEY before running docker compose}
    # One download cache shared by all nodes, so dependencies download once, not five times.
    UV_CACHE_DIR: /uv-cache

services:
  supernode-nepal:
    <<: *sn
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-0
      - --allow-runtime-dependency-installation
    environment:
      <<: *env
      FLWR_FILESYSTEM_ALLOWED_DIRS: /data/supernode-nepal
    volumes:
      - ./keys:/keys:ro
      - ./.uv-cache:/uv-cache
      - ./data/supernode-nepal:/data/supernode-nepal

  supernode-india:
    <<: *sn
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-1
      - --allow-runtime-dependency-installation
    environment:
      <<: *env
      FLWR_FILESYSTEM_ALLOWED_DIRS: /data/supernode-india
    volumes:
      - ./keys:/keys:ro
      - ./.uv-cache:/uv-cache
      - ./data/supernode-india:/data/supernode-india

  supernode-china:
