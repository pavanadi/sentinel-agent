[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Federated cross-border cyclone early warning: nation-local agents share only anonymized risk signals, never raw sensor data, and a coordinator agent infers the storm's impact from the combination alone."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "pavanadi"
display-name = "Sentinel: Federated Flood Early Warning"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "agent/basins/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
