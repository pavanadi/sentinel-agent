[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Federated flood early warning: five upstream countries share only projected river inflow, never raw gauge data, so a coordinator can warn Bangladesh. Synthetic data."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "pavanadi"
display-name = "Sentinel: Federated Flood Early Warning"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "agent/basins/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
