    volumes:
      - ./keys:/keys:ro
      - ./.uv-cache:/uv-cache
      - ./data/supernode-china:/data/supernode-china

  supernode-bhutan:
    <<: *sn
    command:
      - --superlink=fleet-supergrid.flower.ai:443
      - --auth-supernode-private-key=/keys/supernode-3
      - --allow-runtime-dependency-installation
    environment:
      <<: *env
