<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentinel -- Federated Cyclone Early Warning</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="-16 -16 32 32" aria-hidden="true">
        <g class="logo-spin">
          <path d="M0 0 C4 -2 8 -6 6 -11 M0 0 C-4 2 -8 6 -6 11 M0 0 C-2 -4 -6 -8 -11 -6 M0 0 C2 4 6 8 11 6"
                fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </g>
        <circle r="2.4" fill="currentColor" />
      </svg>
      <div>
        <h1>Sentinel</h1>
        <p>Federated cross-border cyclone early warning</p>
      </div>
    </div>

    <div class="mode-switch" role="tablist" aria-label="View mode">
      <button id="mode-solo" role="tab" type="button" aria-selected="true">Each nation alone</button>
      <button id="mode-fed" role="tab" type="button" aria-selected="false">Federated</button>
    </div>

    <div class="actions">
      <button id="demo-btn" class="ghost" type="button">&#9654; Auto demo</button>
      <button id="reset-btn" class="ghost" type="button">Reset</button>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Regional map">
      <div class="map-bar">
        <p class="caption" id="caption">Each nation sees only its own sensors.</p>
        <div class="legend" aria-label="Risk legend">
          <span><i class="dot low"></i>low</span>
          <span><i class="dot mid"></i>moderate</span>
          <span><i class="dot high"></i>high</span>
        </div>
      </div>

      <svg id="map" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Map of three fictional coastal nations along a cyclone track">
        <defs>
          <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a1a33" />
            <stop offset="1" stop-color="#0b2748" />
          </linearGradient>
          <radialGradient id="halo-low">
            <stop offset="0" stop-color="#3fbf8a" stop-opacity=".55" />
            <stop offset="1" stop-color="#3fbf8a" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="halo-mid">
            <stop offset="0" stop-color="#e6b84a" stop-opacity=".6" />
            <stop offset="1" stop-color="#e6b84a" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="halo-high">
            <stop offset="0" stop-color="#ef6a55" stop-opacity=".65" />
            <stop offset="1" stop-color="#ef6a55" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="halo-none">
            <stop offset="0" stop-color="#8fa3c7" stop-opacity=".35" />
            <stop offset="1" stop-color="#8fa3c7" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="cloud">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".9" />
            <stop offset="55%" stop-color="#cfe6ff" stop-opacity=".35" />
            <stop offset="1" stop-color="#cfe6ff" stop-opacity="0" />
          </radialGradient>
          <pattern id="waves" width="60" height="26" patternUnits="userSpaceOnUse">
            <path d="M0 13 q15 -9 30 0 t30 0" fill="none" stroke="#5cc8ff" stroke-opacity=".10" stroke-width="1.4" />
            <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="60 0" dur="14s" repeatCount="indefinite" />
          </pattern>
        </defs>

        <rect width="1000" height="580" fill="url(#sea)" />
        <rect width="1000" height="580" fill="url(#waves)" />

        <!-- graticule -->
        <g class="grid" aria-hidden="true">
          <path d="M100 0V580M200 0V580M300 0V580M400 0V580M500 0V580M600 0V580M700 0V580M800 0V580M900 0V580" />
          <path d="M0 96H1000M0 192H1000M0 288H1000M0 384H1000M0 480H1000" />
        </g>

        <g id="links-layer"></g>
        <g id="track-layer">
          <path id="track" class="track" d="M 862 132 C 790 152 650 205 564 248 C 478 291 380 335 288 359" />
          <path id="track-done" class="track-done" d="M 862 132 C 790 152 650 205 564 248 C 478 291 380 335 288 359" />
        </g>
        <g id="nations-layer"></g>
        <g id="hub-layer"></g>
        <g id="packets-layer"></g>

        <g id="storm" class="storm" aria-hidden="true">
          <circle r="34" fill="url(#cloud)" />
          <g class="storm-spin"><g id="storm-arms"></g></g>
          <circle r="4" fill="#06111f" />
        </g>

        <!-- compass + note -->
        <g class="compass" transform="translate(945 520)" aria-hidden="true">
          <circle r="20" fill="none" stroke="#8fa3c7" stroke-opacity=".35" />
          <path d="M0 -15 L5 4 L0 0 L-5 4 Z" fill="#8fa3c7" fill-opacity=".8" />
          <text y="-24" text-anchor="middle">N</text>
        </g>
        <text class="fiction-note" x="16" y="566">Fictional region -- Doria, Kessa and Averlyn are invented</text>
      </svg>

      <div class="scrubber" id="scrubber">
        <label for="scrub">Coordinator's projected storm track</label>
        <div class="scrub-body">
          <input id="scrub" type="range" min="0" max="1000" value="0" disabled />
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <footer class="foot">
    <span>&#128274; Raw sensor data never leaves a nation. Only a small anonymized signal crosses the border.</span>
    <span class="source-note" id="source-note">Loading run...</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
